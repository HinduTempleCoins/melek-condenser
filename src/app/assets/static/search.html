<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/ico" href="/favicon.ico" />
        <title>Search — MELEK</title>
        <style>
            :root { color-scheme: light dark; }
            html { font-size: 105%; box-sizing: border-box; }
            body {
                font-family: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
                line-height: 1.6; margin: 0; background: #fcfcfc; color: #171f24;
            }
            @media (prefers-color-scheme: dark) { body { background:#0d1117; color:#e6edf3; } }
            .bar { border-bottom: 1px solid rgba(128,128,128,.2); padding: 12px 20px; }
            .bar a { display:inline-flex; align-items:center; gap:.5rem; text-decoration:none;
                color:inherit; font-weight:700; font-size:1.4rem; letter-spacing:.02em; }
            .bar .dot { width:26px; height:26px; border-radius:50%;
                background: conic-gradient(#e11d48 0 33%, #16a34a 33% 66%, #eab308 66% 100%); }
            main { max-width: 680px; margin: 8vh auto; padding: 0 20px; }
            h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
            p.sub { margin:.25rem 0 1.5rem; opacity:.7; }
            form { display:flex; gap:.5rem; }
            input[type=search] {
                flex:1; font-size:1.1rem; padding:.7rem 1rem; border-radius:10px;
                border:1px solid rgba(128,128,128,.4); background:transparent; color:inherit;
            }
            button {
                font-size:1.05rem; font-weight:700; padding:.7rem 1.2rem; border:0; border-radius:10px;
                background:#eab308; color:#171f24; cursor:pointer;
            }
            .hint { margin-top:1.25rem; font-size:.95rem; opacity:.75; }
            .hint code { background:rgba(128,128,128,.15); padding:.1rem .35rem; border-radius:5px; }
        </style>
    </head>
    <body>
        <div class="bar">
            <a href="/"><span class="dot"></span> MELEK</a>
        </div>
        <main>
            <h1>Search MELEK</h1>
            <p class="sub">Find people and posts on the MELEK chain. </p>
            <form id="f" role="search" onsubmit="return go()">
                <input id="q" type="search" name="q" autofocus
                    placeholder="a topic (tag), or @username" aria-label="Search MELEK" />
                <button type="submit">Search</button>
            </form>
            <p class="hint">
                Type <code>@name</code> to open a profile, or a word to browse the latest posts in that
                tag (e.g. <code>art</code>, <code>crypto</code>, <code>melek</code>).
            </p>
        </main>
        <script>
            function slug(s){ return String(s||'').toLowerCase().trim()
                .replace(/^[#@]/,'').replace(/[^a-z0-9-]+/g,'-').replace(/(^-|-$)/g,''); }
            function go(){
                var raw = document.getElementById('q').value.trim();
                if(!raw){ return false; }
                if(raw[0] === '@'){ location.href = '/@' + slug(raw); return false; }
                var t = slug(raw);
                if(!t){ return false; }
                // MELEK-native: browse the newest posts in that tag on this chain
                location.href = '/created/' + t;
                return false;
            }
        </script>
    </body>
</html>
